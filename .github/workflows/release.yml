name: Release container image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  kubernetes-integration:
    permissions:
      contents: read
    uses: ./.github/workflows/integration.yml

  publish:
    needs: [ci, kubernetes-integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/192d-wing/usg-est-issuer
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify release tag and component versions
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)"
          chart_version="$(sed -n 's/^version: \(.*\)$/\1/p' deploy/charts/usg-est-issuer/Chart.yaml)"
          app_version="$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' deploy/charts/usg-est-issuer/Chart.yaml)"
          image_tag="$(sed -n 's/^  tag: "\(.*\)"$/\1/p' deploy/charts/usg-est-issuer/values.yaml)"
          [[ "${version}" == "${cargo_version}" ]]
          [[ "${version}" == "${chart_version}" ]]
          [[ "${version}" == "${app_version}" ]]
          [[ "${version}" == "${image_tag}" ]]
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image for security scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: usg-est-issuer:release-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan release image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: usg-est-issuer:release-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: usg-est-issuer:release-scan
          format: spdx-json
          output-file: usg-est-issuer-${{ env.RELEASE_VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=usg-est-issuer
            org.opencontainers.image.description=Fail-closed RFC 7030 EST external issuer for cert-manager
            org.opencontainers.image.licenses=Apache-2.0

      - name: Publish image with SBOM and provenance
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      - name: Verify multi-platform image
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE}@${{ steps.publish.outputs.digest }}"
          platforms="$(
            docker buildx imagetools inspect "${image}" --raw |
              jq -r '.manifests[]
                | select(.platform.os == "linux")
                | "\(.platform.os)/\(.platform.architecture)"'
          )"
          grep -Fxq "linux/amd64" <<< "${platforms}"
          grep -Fxq "linux/arm64" <<< "${platforms}"

      - name: Create GitHub artifact attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign image digest
        shell: bash
        run: cosign sign --yes "${IMAGE}@${{ steps.publish.outputs.digest }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s@%s\n' "${IMAGE}" "${IMAGE_DIGEST}" > image-digest.txt
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "usg-est-issuer ${RELEASE_VERSION}" \
            --generate-notes \
            "usg-est-issuer-${RELEASE_VERSION}.spdx.json#SPDX SBOM" \
            "image-digest.txt#Published image digest"
