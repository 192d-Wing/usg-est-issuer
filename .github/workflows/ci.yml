name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: docker run --rm -v "$PWD:/work:ro" -w /work docker.io/alpine/helm:3.18.4 lint deploy/charts/usg-est-issuer
      - name: Reject cluster-wide or mutating Secret permissions
        run: |
          set -euo pipefail
          output="$(docker run --rm -v "$PWD:/work:ro" -w /work docker.io/alpine/helm:3.18.4 template test deploy/charts/usg-est-issuer --namespace jitpw)"
          ! grep -q "kind: ClusterRole" <<<"$output"
          ! grep -qE 'verbs:.*(create|delete|patch|update).*[Ss]ecret' <<<"$output"
          grep -q "readOnlyRootFilesystem: true" <<<"$output"
          grep -q 'drop: \["ALL"\]' <<<"$output"

  container:
    name: container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.machine }}"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build native container image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: usg-est-issuer:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - name: Verify image architecture
        shell: bash
        run: test "$(docker image inspect usg-est-issuer:ci-${{ matrix.arch }} --format '{{.Os}}/{{.Architecture}}')" = "${{ matrix.platform }}"
      - name: Scan native container image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: usg-est-issuer:ci-${{ matrix.arch }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
