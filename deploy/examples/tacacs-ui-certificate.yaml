apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tacacs-ui
  namespace: tacacs
spec:
  secretName: tacacs-ui-tls
  duration: 720h
  renewBefore: 168h
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Always
  usages:
    - digital signature
    - server auth
  dnsNames:
    - tacacs-ui.lab.example.mil
  issuerRef:
    name: enterprise-est
    kind: EstIssuer
    group: pki.usg.mil
