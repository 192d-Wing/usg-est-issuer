apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: estissuers.pki.usg.mil
spec:
  group: pki.usg.mil
  scope: Namespaced
  names:
    kind: EstIssuer
    listKind: EstIssuerList
    plural: estissuers
    singular: estissuer
    shortNames: ["esti"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: ["serverUrl", "authentication"]
              properties:
                serverUrl:
                  type: string
                  pattern: '^https://\S+$'
                  minLength: 9
                caLabel:
                  type: string
                  minLength: 1
                authentication:
                  type: object
                  required: ["method", "trustSecretName", "secretName"]
                  properties:
                    method:
                      type: string
                      enum: ["basic", "mutualTls"]
                    trustSecretName:
                      type: string
                      minLength: 1
                    secretName:
                      type: string
                      minLength: 1
                    username:
                      type: string
                      minLength: 1
                policy:
                  type: object
                  properties:
                    allowedDnsSuffixes:
                      type: array
                      minItems: 1
                      maxItems: 32
                      items:
                        type: string
                        pattern: "^\\.?[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?$"
                    maxDnsSans:
                      type: integer
                      minimum: 1
                      maximum: 100
                    maxDuration:
                      type: string
                      pattern: "^[1-9][0-9]*(s|m|h|d)$"
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      ["lastTransitionTime", "message", "reason", "status", "type"]
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      type:
                        type: string
